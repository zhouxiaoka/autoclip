services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: autoclip-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

  # 主应用服务（开发模式）
  autoclip-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autoclip-app-dev
    restart: unless-stopped
    ports:
      - "8000:8000"  # 后端API
      - "3000:3000"  # 前端界面
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/venv  # 排除虚拟环境
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # LLM 配置从宿主机 .env / shell 透传（compose 会自动读项目根目录的 .env 做变量替换）。
      # 没有这一段时 DOCKER.md 里让用户填的 API_DASHSCOPE_API_KEY 根本进不了容器。
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOCLIP_YT_SUBTITLE_LANGS=${AUTOCLIP_YT_SUBTITLE_LANGS:-}
    depends_on:
      - redis
    command: >
      sh -c "
        source venv/bin/activate &&
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload &
        cd frontend && 
        if [ ! -d node_modules ]; then npm install; fi &&
        npx vite --host 0.0.0.0 --port 3000 &
        wait
      "

  # Celery Worker服务（开发模式）
  celery-worker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autoclip-celery-worker-dev
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/venv
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # LLM 配置从宿主机 .env / shell 透传（compose 会自动读项目根目录的 .env 做变量替换）。
      # 没有这一段时 DOCKER.md 里让用户填的 API_DASHSCOPE_API_KEY 根本进不了容器。
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOCLIP_YT_SUBTITLE_LANGS=${AUTOCLIP_YT_SUBTITLE_LANGS:-}
    command: >
      sh -c "
        source venv/bin/activate &&
        celery -A backend.core.celery_app worker --loglevel=debug --reload -Q celery,processing,video,notification,upload
      "
    depends_on:
      - redis
      - autoclip-dev

volumes:
  redis_dev_data:
    driver: local

networks:
  default:
    name: autoclip-dev-network