id: street
version: 1
name: {zh: 街头快剪, en: Street}
fit:
  formats: {street_interview: 1.0, vlog: 0.55, sit_down_interview: 0.25, podcast_studio: 0.15}
  needs_face: true
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.40
  head_zone: [0, 1290]
  zoom:
    mode: step
    step: [1.00, 1.22]
    key_punch: 0.04
    intro: {from: 1.22, dur: 1.0}
  transitions: {broll: cut, max: 2}
  grade: "eq=contrast=1.06:saturation=1.08"
  step_window: true
  progress_bar: {enabled: true, height: 12, inset_x: 0, y_from_bottom: 12, color: "0xD7FF3A"}
overlay:
  entry: index.html
  slots:
    hook: {top: 1812, alt_top: 1812}
    subtitle: {top: 1318, max_rows: 2}
    number: {top: 480, left: 48, width: 360}
  safe_area: xiaohongshu
  limits: {sticker_max: 2, subtitle_words: 3, emphasis_gap_s: 3.0}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, numbers, speakers, stickers]
audio: {bgm: none, optional_bed: false}
cover: {layout: street_3x4, from_overlay: true}
caption_layout:
  font_px: 64
  inset_px: 30
  source_limit: 42
  paging_mode: sentence
  bilingual_align: sentence_screens
  strip_speaker_prefix: true
  en_key_propagates: true
meta:
  desc: {zh: 高对比快节奏大字幕，适合街采与短平快金句, en: High-contrast punchy captions for fast-paced clips}
  tags: [street, fast, short]
  category: street
  order: 20
  package_version: "1.0.0"
  preview_layout: crop
qa: {}
