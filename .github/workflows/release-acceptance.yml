name: Release Acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate tag, e.g. v1.5.1"
        required: true
        type: string
      build_run_id:
        description: "Successful Desktop Build run for this tag"
        required: true
        type: string
      manifest_path:
        description: "Committed sanitized acceptance manifest, e.g. docs/releases/v1.5.1/acceptance.json"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      MANIFEST: ${{ inputs.manifest_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve target and collect immutable build evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['TAG']), 'invalid tag'
          assert re.fullmatch(r'[1-9]\d*', os.environ['BUILD_RUN_ID']), 'invalid build run'
          PY
          git ls-files --error-unmatch -- "$MANIFEST" >/dev/null
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "TARGET_COMMIT=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          gh release download "$TAG" --dir release-assets
      - name: Validate both platforms, regressions, observation and reviewer
        run: |
          python scripts/release_acceptance.py validate --tag "$TAG" --commit "$TARGET_COMMIT" \
            --assets release-assets --manifest "$MANIFEST" --repository "$GH_REPO" \
            --build-run build-run.json --build-jobs build-jobs.json --bundle accepted
      - name: Preserve only reviewed, sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance
          path: accepted/
          if-no-files-found: error
          retention-days: 90
      - name: Summary
        run: echo "Acceptance passed for $TAG ($TARGET_COMMIT). This run does not publish. Supply this run ID to Promote / Halt Release." >> "$GITHUB_STEP_SUMMARY"
