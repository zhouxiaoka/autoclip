name: Publish Template Catalog

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the published template catalog (default rolling tag: templates-catalog)'
        required: false
        default: 'templates-catalog'
        type: string
      templates_dir:
        description: 'Directory containing hot-update template folders to verify and pack (built-ins ship with the app)'
        required: false
        default: 'templates-catalog'
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install template factory dependencies
        run: python -m pip install --upgrade pip pydantic pyyaml

      - name: Verify and pack all templates
        run: |
          mkdir -p dist-templates
          for dir in "${{ inputs.templates_dir }}"/*; do
            if [ -d "$dir" ] && [ -f "$dir/template.yaml" ]; then
              python scripts/template_factory.py verify "$dir"
              python scripts/template_factory.py pack "$dir" --out dist-templates
            fi
          done

      - name: Build catalog.json
        run: |
          python scripts/template_factory.py build-catalog dist-templates \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}" \
            --out dist-templates/catalog.json

      - name: Publish GitHub Release with catalog.json, template packs, and previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ASSETS=(dist-templates/*.zip dist-templates/*.poster.webp dist-templates/*.preview.mp4 dist-templates/*.preview.webm dist-templates/catalog.json)
          TAG="${{ inputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "Templates Catalog ($TAG)" \
              --notes "Automated template catalog release generated by scripts/template_factory.py. Does not replace the latest desktop app release." \
              --latest=false
          fi
