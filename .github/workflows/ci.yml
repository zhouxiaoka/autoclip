name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint backend (ruff)
        continue-on-error: true
        run: ruff check backend

      - name: Run tests
        env:
          DASHSCOPE_API_KEY: test_api_key
          LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
        run: python -m pytest backend/tests -q

      - name: Installed wheel portrait framing smoke
        run: |
          pip install 'opencv-python-headless>=4.10'
          pip wheel --no-deps --wheel-dir /tmp/autoclip-wheel .
          python scripts/verify_python_wheel.py /tmp/autoclip-wheel/autoclip-*-py3-none-any.whl --video backend/assets/example/source.mp4 --report /tmp/autoclip-wheel/portrait-report.json

      - name: Community board and feedback ingest checks
        run: |
          python3 scripts/test_community_board.py
          python3 scripts/test_ingest_feedback.py

      - name: Set up Node for source launcher
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Source launcher and scoped shutdown smoke
        run: |
          python -m venv --system-site-packages venv
          (cd frontend && npm ci)
          cp env.example .env
          docker run -d --name autoclip-source-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec autoclip-source-redis redis-cli ping; then break; fi
            sleep 1
          done
          ./quick_start.sh
          ./status_autoclip.sh
          ./stop_autoclip.sh
          if ./status_autoclip.sh; then echo 'Stopped services incorrectly reported healthy'; exit 1; fi
      - name: Source runtime logs on failure
        if: failure()
        run: cat logs/backend.log logs/frontend.log logs/celery.log 2>/dev/null || true
      - name: Clean up source smoke
        if: always()
        run: |
          ./stop_autoclip.sh || true
          docker rm -f autoclip-source-redis || true

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests (analytics, desktop, i18n, publish and Studio)
        run: npm test


      - name: Build
        run: npm run build

  # Guards the README's recommended `docker compose` path, which was broken for months
  # without anything in CI noticing (issue #88): the image failed to build, the worker
  # consumed the wrong queues, and a hardcoded localhost Redis check failed every project.
  docker-smoke:
    name: Docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build autoclip

      - name: Start redis + api + worker
        run: |
          # Bind-mounted dirs are created root-owned by the daemon; the container runs as
          # a non-root user, so pre-create them writable.
          mkdir -p data logs uploads && chmod -R 777 data logs uploads
          # A throwaway .env, the way DOCKER.md tells users to configure the LLM.
          printf 'LLM_PROVIDER=openai\nOPENAI_BASE_URL=http://llm.example.test/v1\nAPI_MODEL_NAME=smoke-model\n' > .env
          docker compose up -d --no-build redis autoclip celery-worker

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ >/dev/null 2>&1; then
              echo "API healthy after ${i} tries"; exit 0
            fi
            sleep 3
          done
          echo "API never became healthy"; exit 1

      - name: yt-dlp is importable on the image's Python
        run: docker compose exec -T autoclip python -m yt_dlp --version

      - name: LLM settings from .env reach both api and worker
        run: |
          for svc in autoclip celery-worker; do
            docker compose exec -T "$svc" python - <<'EOF'
          import os, sys
          sys.path.insert(0, "/app")
          from backend.core.llm_manager import LLMManager
          info = LLMManager().get_current_provider_info()
          assert info["provider"] == "openai", info
          assert info["model"] == "smoke-model", info
          assert info.get("base_url") == "http://llm.example.test/v1", info
          assert info["available"] is True, info   # keyless custom endpoint is enough
          print("OK", os.environ.get("HOSTNAME"), info)
          EOF
          done

      - name: Task submission reaches Redis via REDIS_URL
        run: |
          docker compose exec -T autoclip python - <<'EOF'
          from backend.utils.task_submission_utils import _log_queue_depth
          depth = _log_queue_depth("processing")
          assert depth is not None, "could not reach Redis through REDIS_URL"
          print("processing queue depth:", depth)
          EOF

      - name: Worker consumes the routed queues
        run: |
          for i in $(seq 1 20); do
            out=$(docker compose exec -T celery-worker celery -A backend.core.celery_app inspect --json --timeout 10 active_queues 2>/dev/null || true)
            if echo "$out" | grep -q '"name": "processing"'; then break; fi
            sleep 5
          done
          echo "$out"
          for q in celery processing video notification upload; do
            echo "$out" | grep -q "\"name\": \"$q\"" || { echo "worker is not consuming queue: $q"; exit 1; }
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  docker-dev-smoke:
    name: Docker development compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker compose -f docker-compose.dev.yml build autoclip-dev
      - name: Start development services through compatibility entrypoint
        run: ./docker-start.sh dev --no-build
      - name: Wait for both development servers and the worker
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/v1/health/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8000/api/v1/health/
          curl -fsS http://localhost:3000/ >/dev/null
          for i in $(seq 1 20); do
            out=$(docker compose -f docker-compose.dev.yml exec -T celery-worker-dev celery -A backend.core.celery_app inspect --json --timeout 5 active_queues 2>/dev/null || true)
            if echo "$out" | grep -q '"name": "processing"'; then break; fi
            sleep 3
          done
          for q in celery processing video notification upload; do
            echo "$out" | grep -q "\"name\": \"$q\""
          done
          ./docker-status.sh dev
      - name: Stop through compatibility entrypoint
        run: |
          ./docker-stop.sh dev
          if ./docker-status.sh dev; then echo 'Stopped containers incorrectly reported healthy'; exit 1; fi
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: Tear down CI resources
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans
