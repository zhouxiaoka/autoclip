name: Desktop Build

# Single, unified desktop packaging pipeline.
#
# This replaces the old PyInstaller / prepare_resources workflows (build-*.yml),
# none of which ever produced a working installable app (see issue #65). It runs
# the proven python-build-standalone (PBS) route: portable Python + backend
# source + static ffmpeg/ffprobe, packaged per platform:
#   - macOS arm64:  scripts/build_macos_arm.sh   -> .app injected + ad-hoc signed + DMG
#   - Windows x64:  scripts/build_windows_x64.sh -> NSIS installer (resources declared
#                   in src-tauri/tauri.windows.conf.json)
# Both share scripts/lib/desktop_build_common.sh.
#
# Triggers:
#   - workflow_dispatch: build on demand (pick platforms)
#   - push tags v*:      build + attach the artifacts to a GitHub Release

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build macOS arm64 DMG"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows x64 installer"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

# Needed by softprops/action-gh-release to create the Release and upload the
# artifacts. Without this the default GITHUB_TOKEN is read-only and the release
# step fails with "Resource not accessible by integration" (403).
permissions:
  contents: write

env:
  # GitHub runners are in the US; the default tsinghua mirror in the build
  # script is slow/unreliable from there, so use PyPI directly.
  PIP_INDEX_URL: https://pypi.org/simple
  SENTRY_ORG: autoclip-ts
  SENTRY_PROJECT: autoclip-frontend

jobs:
  build-macos-arm64:
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check Sentry upload credentials
        env:
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/check_sentry_build.mjs

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache portable Python + ffmpeg downloads
        uses: actions/cache@v4
        with:
          path: |
            build/pbs-cache
            build/ffmpeg-cache
          key: desktop-downloads-macos-${{ hashFiles('scripts/build_macos_arm.sh', 'scripts/lib/desktop_build_common.sh') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build desktop app (PBS route)
        env:
          # PostHog analytics. The phc_ key is a public client key (it ships in
          # the frontend bundle anyway), but we keep it in repo Secrets so it's
          # easy to rotate and not hard-coded. Set this secret in
          # Settings -> Secrets and variables -> Actions. If unset, the build
          # still succeeds and analytics is a no-op at runtime.
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ secrets.VITE_PUBLIC_SENTRY_DSN != '' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build_macos_arm.sh

      - name: Verify shipped macOS runtime before publishing
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/AutoClip Desktop.app"
          RESOURCES="$PWD/$APP/Contents/Resources/resources"
          codesign --verify --deep --strict "$APP"
          "$RESOURCES/python/bin/python3" -B scripts/verify_macos_bundle.py --resources "$RESOURCES" --output-parent "$RUNNER_TEMP/autoclip-release-validation"
          codesign --verify --deep --strict "$APP"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-desktop-macos-arm64
          path: |
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          retention-days: 30

  build-windows-x64:
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash: the build script is bash and shares its library with macOS.
        shell: bash
    steps:
      # The runner's git defaults to autocrlf=true; CRLF shell scripts fail in
      # bash with "$'\r': command not found". (.gitattributes enforces LF for
      # *.sh as well, this is belt and braces for older checkouts.)
      - name: Force LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check Sentry upload credentials
        env:
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/check_sentry_build.mjs

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache portable Python + ffmpeg downloads
        uses: actions/cache@v4
        with:
          path: |
            build/pbs-cache
            build/ffmpeg-cache
          key: desktop-downloads-windows-${{ hashFiles('scripts/build_windows_x64.sh', 'scripts/lib/desktop_build_common.sh') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build desktop app (PBS route)
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ secrets.VITE_PUBLIC_SENTRY_DSN != '' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build_windows_x64.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-desktop-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30

  # 没有 Windows 真机时的替代冒烟：在干净的 windows-latest 上装上一个正式版，
  # 模拟旧版后端残留锁住 _asyncio.pyd，再静默覆盖安装本次构建，然后用安装目录里的 Python
  # 跑后端 / ffmpeg / 来源守卫。界面和真实链接下载仍需人工或用户验证，见 RELEASE_CHECKLIST.md。
  smoke-windows-x64:
    needs: build-windows-x64
    if: needs.build-windows-x64.result == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download new installer
        uses: actions/download-artifact@v4
        with:
          name: autoclip-desktop-windows-x64
          path: new

      - name: Upgrade over previous release and verify installed runtime
        run: |
          $installer = Get-ChildItem -Recurse new -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/windows_upgrade_smoke.ps1 -NewInstaller $installer.FullName

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-report
          path: windows-smoke.json
          if-no-files-found: ignore

  # Publish only after both platforms succeed; never advertise a partial release.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-macos-arm64.result == 'success' && needs.build-windows-x64.result == 'success' && needs.smoke-windows-x64.result == 'success'
    needs: [build-macos-arm64, build-windows-x64, smoke-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: autoclip-desktop-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Set up Python for CLI and MCP release
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and verify CLI and MCP wheel from the same tag
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-python-headless>=4.10'
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/verify_python_wheel.py dist/autoclip-*-py3-none-any.whl --video backend/assets/example/source.mp4 --report "$RUNNER_TEMP/wheel-portrait-report.json"
          python scripts/build_python_release.py dist/autoclip-*-py3-none-any.whl --out "dist/autoclip-${GITHUB_REF_NAME#v}-cli-mcp.zip"
          (cd dist && sha256sum *.whl *-cli-mcp.zip > python-release-sha256.txt)

      # Release 正文 = CHANGELOG.md 里该版本的段落 + 平台安装说明（scripts/release_notes.py，仅标准库）
      - name: Render release notes from CHANGELOG
        run: python3 scripts/release_notes.py "${{ github.ref_name }}" -o release_body.md && cat release_body.md
      - name: Verify updater signatures against the shipped public key
        run: |
          python3 -m pip install cryptography==50.0.1
          python3 scripts/verify_updater_signatures.py dist/*.app.tar.gz dist/*setup.exe

      - name: Write updater latest.json
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          DARWIN=$(ls dist/*.app.tar.gz 2>/dev/null | head -1 || true)
          WINDOWS=$(ls dist/*setup.exe dist/*-setup.exe 2>/dev/null | head -1 || true)
          ARGS=(--version "$VERSION" --tag "$GITHUB_REF_NAME" --out dist/latest.json --changelog CHANGELOG.md)
          if [ -n "$DARWIN" ]; then ARGS+=(--darwin-aarch64 "$DARWIN"); fi
          if [ -n "$WINDOWS" ]; then ARGS+=(--windows-x86_64 "$WINDOWS"); fi
          python3 scripts/write_updater_manifest.py "${ARGS[@]}"
          ls -la dist/latest.json 2>/dev/null || echo "NOTE: latest.json not written (no signed artifacts)"

      # 先以 Pre-release 发出：应用内更新读的是 releases/latest/download/latest.json，
      # Pre-release 不算 latest，所以这时只有手动下载的人拿得到。
      # 真机冒烟 + 观察期通过后，跑 promote-release.yml 转正，才推给所有用户。见 RELEASE_CHECKLIST.md。
      - name: Create / update GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoClip Desktop ${{ github.ref_name }}"
          files: dist/*
          body_path: release_body.md
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
