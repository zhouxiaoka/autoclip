name: Temporary CRT signature diagnosis
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Frozen candidate source to inspect
        required: true
        default: b49f353847c59ccdf8f13f06ca21385a77dd904e
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Inspect actual release CRT signatures in PowerShell 7
        shell: pwsh
        run: |
          & ./diagnostics/scripts/crt_signature_diagnostic.ps1 -SourceDir ./source -OutputFile "$env:RUNNER_TEMP/crt-signatures-pwsh.json"
      - name: Inspect same files in Windows PowerShell 5.1
        if: always()
        shell: powershell
        run: |
          & ./diagnostics/scripts/crt_signature_diagnostic.ps1 -SourceDir ./source -OutputFile "$env:RUNNER_TEMP/crt-signatures-windows-powershell.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-signature-diagnostic
          path: ${{ runner.temp }}/crt-signatures-*.json
          if-no-files-found: error
          retention-days: 3
