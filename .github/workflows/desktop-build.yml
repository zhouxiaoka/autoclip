name: Temporary CRT preparation regression
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Original frozen candidate before signature repair
        required: true
        default: b49f353847c59ccdf8f13f06ca21385a77dd904e
permissions:
  contents: read
jobs:
  verify-crt:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Actual original/fixed CRT preparation and negative checks
        shell: powershell
        run: |
          & ./diagnostics/scripts/crt_preparation_regression.ps1 -SourceDir ./source -FixedScript ./diagnostics/scripts/prepare_windows_python_crt.fixed.ps1 -SignatureTests ./diagnostics/scripts/tests/test_prepare_windows_python_crt.ps1 -OutputDir "$env:RUNNER_TEMP/crt-preparation-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-preparation-regression
          path: ${{ runner.temp }}/crt-preparation-evidence/*
          if-no-files-found: error
          retention-days: 3
