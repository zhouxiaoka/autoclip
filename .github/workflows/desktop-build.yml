name: Temporary CRT default invocation regression
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Frozen source whose production default invocation failed
        required: true
        default: 4f457f766319d95e140960b474ac096259311592
permissions:
  contents: read
jobs:
  verify-crt-default:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Exact Git Bash production invocation before and after
        shell: bash
        working-directory: diagnostics
        run: bash scripts/crt_default_invocation_regression.sh ../source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-default-invocation-regression
          path: ${{ runner.temp }}/crt-default-invocation-evidence/*
          if-no-files-found: error
          retention-days: 3
