# 只重跑 Windows 安装冒烟，复用某次 desktop-build 已经打好的安装包，不用再等 25 分钟构建。
# 调冒烟脚本、复现安装问题时用。
name: Windows Install Smoke

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "desktop-build.yml 的 run id（其中 build-windows-x64 成功）"
        required: true
        type: string
      verify_whisper:
        description: "Install Whisper and run cached real speech with installed portable Python"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download installer from build run
        uses: actions/download-artifact@v4
        with:
          name: autoclip-desktop-windows-x64
          path: new
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade over previous release and verify installed runtime
        run: |
          $installer = Get-ChildItem -Recurse new -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/windows_upgrade_smoke.ps1 -NewInstaller $installer.FullName

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-report
          path: windows-smoke.json
          if-no-files-found: ignore

      - name: Installed CLI/MCP wheel portrait and font smoke
        run: |
          $resources = (Get-Content windows-smoke.json -Raw | ConvertFrom-Json).resources
          $python = Join-Path $resources 'python\python.exe'
          $runtime = Join-Path $env:RUNNER_TEMP 'wheel-framing-runtime'
          & $python -m pip install --target $runtime 'opencv-python-headless>=4.10'
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV test runtime install failed' }
          & $python -m pip wheel --no-deps --wheel-dir wheel .
          if ($LASTEXITCODE -ne 0) { throw 'CLI/MCP wheel build failed' }
          $wheel = Get-ChildItem wheel -Filter 'autoclip-*-py3-none-any.whl' | Select-Object -First 1
          $env:AUTOCLIP_FFMPEG_PATH = Join-Path $resources 'ffmpeg\ffmpeg.exe'
          $env:AUTOCLIP_FFPROBE_PATH = Join-Path $resources 'ffmpeg\ffprobe.exe'
          & $python -B scripts/verify_python_wheel.py $wheel.FullName --opencv-dir $runtime --video backend/assets/example/source.mp4 --report installed-wheel-portrait.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel portrait/font smoke failed' }

      - name: Upload installed wheel portrait report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-wheel-portrait-report
          path: installed-wheel-portrait.json
          if-no-files-found: ignore

      - name: Verify actual installed Whisper runtime and cached transcription
        if: inputs.verify_whisper
        run: |
          $report = Get-Content windows-smoke.json -Raw | ConvertFrom-Json
          $resources = $report.resources
          & (Join-Path $resources 'python\python.exe') -B scripts\verify_whisper_recovery.py --resources $resources --report installed-whisper-report.json
          if ($LASTEXITCODE -ne 0) { throw "Installed Whisper acceptance failed: $LASTEXITCODE" }

      - name: Upload installed Whisper report
        if: always() && inputs.verify_whisper
        uses: actions/upload-artifact@v4
        with:
          name: installed-whisper-report
          path: installed-whisper-report.json
          if-no-files-found: ignore
