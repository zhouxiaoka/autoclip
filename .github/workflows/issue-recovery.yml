name: Issue recovery acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/services/whisper_runtime.py'
      - 'backend/services/whisper_model_manager.py'
      - 'backend/utils/speech_recognizer.py'
      - 'backend/pipeline/**'
      - 'backend/core/database.py'
      - 'backend/tests/test_database_connections.py'
      - 'scripts/verify_whisper_recovery.py'
      - '.github/workflows/issue-recovery.yml'
permissions:
  contents: read
jobs:
  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      AUTOCLIP_DATA_DIR: '${{ github.workspace }}/.test-data/autoclip-recovery'
      AUTOCLIP_APP_DIR: '${{ github.workspace }}/.test-data/autoclip-recovery'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt numpy
          choco install ffmpeg --yes --no-progress
      - name: Failure recovery regressions
        run: python -m pytest backend/tests/test_issue_closure_regressions.py backend/tests/test_whisper_local_subtitle.py backend/tests/test_whisper_model_download.py backend/tests/test_windows_media_feedback.py backend/tests/test_windows_asyncio.py backend/tests/test_recent_feedback.py backend/tests/test_deepseek_cost_guard.py backend/tests/test_task_submission.py backend/tests/test_database_connections.py -q
      - name: Install Whisper and transcribe real speech offline
        run: python scripts/verify_whisper_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-issue-recovery
          path: issue-recovery-report.json
          if-no-files-found: ignore
