title: "希望支持模型："
body:
  - type: markdown
    attributes:
      value: |
        说明你要的模型或供应商。AutoClip 已支持 OpenAI 兼容接口、Gemini、通义千问、硅基流动，以及本机的 Ollama / LM Studio。
        只是「名单里没有这一项」、但兼容接口已经能填的，请在正文里写明，避免重复开需求。
  - type: input
    id: model
    attributes:
      label: 模型或供应商
      placeholder: "Gemini 2.5 / Claude / Qwen 某个具体型号"
    validations:
      required: true
  - type: dropdown
    id: gap
    attributes:
      label: 现在差在哪
      options:
        - 设置里找不到这一项
        - 能填兼容接口，但效果或报错有问题
        - 希望有免费用的本地模型说明
        - 其他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 补充
      description: 报错请打码，不要贴 API Key。
    validations:
      required: false
