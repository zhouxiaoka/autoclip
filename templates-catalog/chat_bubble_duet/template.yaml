id: chat_bubble_duet
version: 2
name: { zh: "聊天气泡", en: "Chat Pop" }
fit:
  formats: {vlog: 0.95, sit_down_interview: 1.0, podcast_studio: 1.0}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.36
  head_zone: [240, 1120]
  zoom:
    mode: creep
    creep: 0.02
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.04"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 200, alt_top: 200}
    subtitle: {top: 1260, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.0}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 42
  inset_px: 96
  source_limit: 34
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "原生聊天软件对话气泡：随口播弹性弹出左右交替气泡（白底+微信绿），保留上一句轻淡历史记录，适合双人播客、吐槽与高互动切片", en: "Messaging-style spring-popping speech bubbles alternating left and right with subtle previous-message history in the lower face-safe zone"}
  tags: [chat, bubble, dialogue, podcast, viral, animated]
  category: general
  order: 82
  package_version: "1.0.0"
  author: AutoClip
  preview_layout: crop
qa: {}
