id: gta_vice_sunset
version: 2
name: {zh: "罪城落日", en: "Vice City Sunset"}
fit:
  formats: {keynote_stage: 0.7, sit_down_interview: 0.5, street_interview: 0.6}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: window
  face_y: 0.5
  head_zone: [440, 1200]
  zoom:
    mode: creep
    creep: 0.0
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.02:saturation=1.0"
  creator_pack:
    pack_id: autoclip.gta-vi-creator
    theme: vice-city-sunset
    default_layout: coast
    default_effect: coast-pass
overlay:
  entry: index.html
  slots:
    hook: {top: 132, alt_top: 132}
    subtitle: {top: 1350, max_rows: 2}
  safe_area: douyin
  limits: {emphasis_gap_s: 3.0}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: gta_vice_sunset_3x4, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 96
  source_limit: 56
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "海岸漫游与探索高光：全幅游戏景别、斜体刊头、落日印章与左下主播窗", en: "Coastal drive & exploration highlights with full-bleed gameplay and sunset chrome"}
  tags: [gaming, gta, sunset, coast]
  category: gaming
  order: 70
  package_version: "1.0.0"
  author: AutoClip
  preview_layout: fit
qa: {}
