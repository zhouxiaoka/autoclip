id: red_white_kinetic
version: 2
name: { zh: "高能双拍", en: "Pulse Clash" }
fit:
  formats: {vlog: 1.0, sit_down_interview: 0.95, podcast_studio: 0.9, keynote_stage: 0.9}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.36
  head_zone: [240, 1140]
  zoom:
    mode: creep
    creep: 0.024
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.08:saturation=1.05"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 170, alt_top: 170}
    subtitle: {top: 1240, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.5}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "专为高能观点口播打造：红白交错大小字体 30fps 弹性动效字幕，重点词巨幅红白交替炸屏且严格避脸", en: "High-energy alternating crimson-red and pure-white mixed-size kinetic captions with bouncy 30fps spring motion"}
  tags: [kinetic, red, white, viral, animated]
  category: general
  order: 69
  package_version: "1.0.0"
  author: AutoClip
  preview_layout: crop
variables:
  - key: accent_color
    kind: color
    default: "#EF4444"
    label: {zh: "主色", en: "Accent"}
  - key: font_scale
    kind: select
    default: "M"
    options: ["S", "M", "L"]
    label: {zh: "字号", en: "Size"}
qa: {}
