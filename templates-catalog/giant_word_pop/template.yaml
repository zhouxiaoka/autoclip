audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "深暗电影色调 + 正中超大白色单字逐拍重击，适合强情绪、节奏感极强的个人观点切片", en: "Moody dark studio grade with massive dead-center single-word kinetic typography synced to speech beats"}
  tags: [kinetic, bold, minimal, dark, viral]
