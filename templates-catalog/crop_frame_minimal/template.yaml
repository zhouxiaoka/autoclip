id: crop_frame_minimal
version: 2
name: {zh: "极简虚线取景框", en: "Crop Frame Minimal"}
fit:
  formats: {vlog: 1.0, sit_down_interview: 0.92, podcast_studio: 0.88, keynote_stage: 0.88}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.38
  head_zone: [240, 1200]
  zoom:
    mode: creep
    creep: 0.028
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.03:saturation=1.02"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 180, alt_top: 180}
    subtitle: {top: 1240, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.5}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "对标 Garden Storytime：上方极简白色虚线选框与四角锚点微动效 + 细腻小写无衬线柔焦字幕", en: "Faithful to Garden Storytime: crisp white dotted crop frame with corner handles and minimal blur-reveal captions"}
  tags: [minimal, frame, storytime, aesthetic, animated]
  category: general
  order: 86
  package_version: "1.1.0"
  author: AutoClip
  preview_layout: crop
qa: {}
