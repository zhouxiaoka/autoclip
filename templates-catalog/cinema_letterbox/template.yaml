id: cinema_letterbox
version: 2
name: {zh: "影院留白极简", en: "Cinema Letterbox"}
fit:
  formats: {vlog: 1.0, sit_down_interview: 0.95, podcast_studio: 0.9, keynote_stage: 0.9}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.36
  head_zone: [240, 1140]
  zoom:
    mode: creep
    creep: 0.024
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.06:saturation=0.86:brightness=-0.02"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 170, alt_top: 170}
    subtitle: {top: 1580, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.5}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "对标 63 万播放 Chase Your Dreams：纯黑影院上下遮幅 + 细长无衬线轻字重逐词诗意浮现，绝不遮脸", en: "Faithful to 631K-view Chase Your Dreams: pure black cinema letterbox with ultra-light condensed word-by-word reveal"}
  tags: [cinema, minimal, letterbox, aesthetic, animated]
  category: general
  order: 61
  package_version: "1.1.0"
  author: AutoClip
  preview_layout: crop
qa: {}
