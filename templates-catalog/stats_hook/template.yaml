id: stats_hook
version: 2
name: {zh: "动态数据战绩卡", en: "Animated Stats Hook"}
fit:
  formats: {vlog: 1.0, sit_down_interview: 0.92, podcast_studio: 0.88, keynote_stage: 0.88}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.38
  head_zone: [240, 1200]
  zoom:
    mode: creep
    creep: 0.028
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.05:saturation=0.98"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 180, alt_top: 180}
    subtitle: {top: 1440, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.5}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "Space Grotesk 磨砂数据卡片 + 数字实时滚数增长 + 绿线折线图动态绘制，适合商业与增长复盘", en: "Frosted Space Grotesk analytics card with live animated metric counter and real-time SVG sparkline draw-in"}
  tags: [business, stats, counter, growth, animated]
  category: knowledge
  order: 66
  package_version: "1.1.0"
  author: AutoClip
  preview_layout: crop
qa: {}
