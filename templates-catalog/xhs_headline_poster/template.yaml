  needs_face: true
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.42
  head_zone: [340, 1200]
  zoom:
    mode: creep
    creep: 0.02
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.06:saturation=1.04"
  picture_layout: crop
overlay:
