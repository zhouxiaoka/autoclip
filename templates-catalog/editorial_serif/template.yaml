id: editorial_serif
version: 2
name: {zh: "极简杂志衬线", en: "Editorial Serif"}
fit:
  formats: {vlog: 1.0, sit_down_interview: 0.92, podcast_studio: 0.88, keynote_stage: 0.88}
  needs_face: false
canvas: {aspects: [portrait], overlay_px: [1080, 1920], fps: 30}
base:
  framing: full_face
  face_y: 0.38
  head_zone: [240, 1200]
  zoom:
    mode: creep
    creep: 0.028
  transitions: {broll: none, max: 0}
  grade: "eq=contrast=1.02:saturation=0.92:brightness=0.01"
  picture_layout: crop
overlay:
  entry: index.html
  slots:
    hook: {top: 180, alt_top: 180}
    subtitle: {top: 1210, max_rows: 2}
  safe_area: tiktok
  limits: {emphasis_gap_s: 2.5}
fields:
  required: [title_lines, cues]
  optional: [kicker, emphasis, speakers]
audio: {bgm: none}
cover: {layout: street_9x16, from_overlay: true}
caption_layout:
  font_px: 46
  inset_px: 88
  source_limit: 42
  paging_mode: phrase
  bilingual_align: per_cue
  strip_speaker_prefix: true
  en_key_propagates: false
  burn_cover_title: true
  keep_punctuation: true
meta:
  desc: {zh: "Instrument Serif 正斜体混排 + Higgsfield 招牌模糊渐清晰浮现动效，高级电影感生活口播", en: "Instrument Serif editorial typography with signature blur-to-sharp focus reveal animation"}
  tags: [editorial, serif, minimal, blur-reveal, aesthetic]
  category: general
  order: 64
  package_version: "1.1.0"
  author: AutoClip
  preview_layout: crop
qa: {}
