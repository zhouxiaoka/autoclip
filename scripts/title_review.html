<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · 文字预设审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#eef1f5;font:15px/1.65 system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:28px;margin:0}p{color:#a7b1be;margin:6px 0}small{color:#a7b1be}.tag{color:#bafb79;font-size:12px;letter-spacing:2px}button,a{font:inherit}button{cursor:pointer;background:#242c36;color:#e8eef5;border:1px solid #3b4758;border-radius:9px;padding:8px 15px}button[aria-pressed=true]{background:#d8fa99;color:#172310;border-color:#d8fa99}button:disabled{opacity:.35;cursor:default}.tabs{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.stage{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:34px;background:#171d24;padding:24px;border:1px solid #293440;border-radius:18px}video,.preview{width:100%;aspect-ratio:9/16;object-fit:contain;background:#080c10;border-radius:8px}.preview[hidden],video[hidden]{display:none}h2{font-size:25px;margin:2px 0 12px}.mode{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}li{margin:10px 0;color:#cad3df}a{color:#cff992}nav{display:flex;gap:10px;margin:24px 0}.note{padding:14px;border-left:3px solid #82975f;background:#1e272d;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:26px}.card{padding:0;overflow:hidden;text-align:left;background:#171d24}.card img{width:100%;display:block}.card span{display:block;padding:10px}details{margin-top:30px}details img{max-width:100%;margin-top:15px}@media(max-width:700px){main{padding:18px}.stage{grid-template-columns:1fr;padding:14px}.stage>div:first-child{max-width:340px;margin:auto}.grid{grid-template-columns:repeat(2,1fr)}header{display:block}}
</style>
<main><header><div><div class="tag">AUTOCLIP / TYPE REVIEW 02</div><h1>四款文字预设，逐款审阅</h1><p>同一段素材、同一句文案。先看字形和层次，再看动态效果。</p></div><small>1080 × 1920 · 10 秒<br>产品渲染器实际输出</small></header>
<div class="tabs" id="tabs"></div><section class="stage"><div><video id="video" controls playsinline preload="metadata"></video><img id="still" class="preview" hidden alt="中文排版静帧"></div><div><div class="tag" id="number"></div><h2 id="name"></h2><p id="intro"></p><div class="mode"><button id="new" aria-pressed="true">加强版视频</button><button id="old" aria-pressed="false">原版视频</button><button id="zh" aria-pressed="false">中文静帧</button></div><ul id="points"></ul><div class="note">复看重点：标题是否足够有力？字块是否太大？有没有挡住角色和关键玩法？</div><p style="margin-top:20px">英文视频包含短入场，标题在首镜头前 4 秒显示。中文按钮展示同一绘字实现的静态排版。</p><nav><button id="prev">← 上一款</button><button id="next">下一款 →</button></nav><a id="download" download>下载当前视频</a><p><small>旧草稿保留原版；编辑器可切换“原版／加强版”。本页供视觉复看，不代表买量效果验收。</small></p></div></section>
<div class="grid" id="grid"></div><details><summary>查看最初设计参考图</summary><img src="design-reference.png" alt="最初六款文字预设设计参考图"></details></main>
<script>
const styles=[
{id:'comic',name:'漫画冲击',intro:'更大的黄黑字块，强化墨线和硬阴影。',points:['加粗外轮廓与右下厚阴影，让字块从背景中分离。','第二行放大，整体倾斜 6°，保留少量漫画装饰。']},
{id:'neon',name:'荧光挑战',intro:'白色上句与荧光强调带形成清晰两层。',points:['扩大黑色关键词与荧光底板，缩紧两行距离。','加入短下划线，整体轻倾斜 3°。']},
{id:'arena',name:'竞技斜切',intro:'更宽的斜切底板与蓝色侧边，突出竞技感。',points:['两层深蓝底板承托粗斜体，末行荧光黄。','扩大蓝色侧边，保持硬朗切角与短横向入场。']},
{id:'editorial',name:'极简大字',intro:'新增奶白大字与朱红底线，减少装饰。',points:['直立粗字、左对齐、紧凑行距。','红色底线嵌在末行基线下，没有整块背景卡。']}
];let index=0,mode='new';const $=id=>document.getElementById(id);
styles.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`0${i+1} ${s.name}`;b.onclick=()=>select(i);$('tabs').append(b);const c=document.createElement('button');c.className='card';c.innerHTML=`<img src="${s.id}-v2.jpg" alt="${s.name}加强版"><span>0${i+1} ${s.name}</span>`;c.onclick=()=>{select(i);window.scrollTo({top:0,behavior:'smooth'})};$('grid').append(c)});
function select(i){index=i;mode='new';update()}
function update(){const s=styles[index];$('video').pause();$('number').textContent=`PRESET 0${index+1} / 04`;$('name').textContent=s.name;$('intro').textContent=s.intro;$('points').innerHTML=s.points.map(p=>`<li>${p}</li>`).join('');$('old').disabled=s.id==='editorial';if($('old').disabled&&mode==='old')mode='new';const file=`${s.id}-v${mode==='old'?1:2}.mp4`;$('video').hidden=mode==='zh';$('still').hidden=mode!=='zh';if(mode!=='zh'){$('video').src=file;$('video').poster=`${s.id}-v${mode==='old'?1:2}.jpg`}else $('still').src=`${s.id}-zh.jpg`;$('download').href=mode==='zh'?`${s.id}-zh.jpg`:file;$('download').textContent=mode==='zh'?'下载中文静帧':'下载当前视频';['new','old','zh'].forEach(m=>$(m).setAttribute('aria-pressed',String(m===mode)));[...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));$('prev').disabled=index===0;$('next').disabled=index===3}
['new','old','zh'].forEach(m=>$(m).onclick=()=>{mode=m;update()});$('prev').onclick=()=>select(index-1);$('next').onclick=()=>select(index+1);update();
</script></html>
