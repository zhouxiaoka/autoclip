</style><main><div class="tag">AUTOCLIP / FIRST RELEASE TYPE REVIEW</div><h1>六款模板，统一校准</h1><p>漫画沿用已确认效果，其余五款逐项优化。每款都有中英文实际视频，并保留上一轮与原设计对比。</p><div class="tabs" id="tabs"></div><section class="stage"><div><video id="video" controls playsinline preload="metadata"></video></div><div><div class="tag" id="number"></div><h2 id="name"></h2><p id="intro"></p><div class="modes"><button id="en" aria-pressed="true">本轮英文</button><button id="old" aria-pressed="false">上一版英文</button><button id="zh" aria-pressed="false">本轮中文</button></div><img class="compare" id="comparison" alt="原设计、上一版与本轮标题放大对比"><ul id="points"></ul><div class="note">逐款看字形、比例和材质，再检查视频中的可读性与遮挡。漫画已确认，其余五款待复看。</div><p>1080 × 1920 · 每条10秒 · 保留游戏原声<br>标题在开头4秒显示。像素和磨砂固定，其余款有短入场。</p><nav><button id="prev">← 上一款</button><button id="next">下一款 →</button></nav><a id="download" download>下载当前视频</a><p><small>旧草稿保留原版本。此页验证模板效果，不代表已经通过买量投放验收。卡拉 OK 排在六款定稿之后。</small></p></div></section><div class="grid" id="grid"></div><details><summary>查看最初设计参考图</summary><img src="design-reference.png" alt="最初六款文字预设设计参考图"></details></main><script>
const styles=[
{id:'comic',name:'漫画冲击',intro:'沿用已确认的漫画加强版，作为本轮质量基准。',points:['粗斜体、紧凑字块、放大的末行与硬墨线。','本轮与已确认漫画版本使用完全一致的字层。']},
{id:'neon',name:'荧光挑战',intro:'紧凑白字搭配荧光关键词带。',points:['换为更厚的凝缩字形，缩紧两行。','清晰黑字与饱和荧光底板，去掉金属横向反光。']},
{id:'arena',name:'竞技斜切',intro:'重新塑造斜体字面与锐利的竞技底板。',points:['字形倾斜与整个字块旋转分开处理。','近黑底板、蓝色侧翼与末行亮黄形成三层。']},
{id:'pixel',name:'像素街机',intro:'更高的像素字面、紧凑的字距与莓红描边。',points:['保留点阵字形，调整纵向比例及词间距。','轻倾斜深色卡片和像素角框；中文使用网格化字体回退。']},
{id:'editorial',name:'极简大字',intro:'高窄奶白粗字与嵌入基线的朱红色块。',points:['更高的字面、紧行距、左对齐，突出字号对比。','黑色硬边承托文字，红色底线保持存在感。']},
{id:'frosted',name:'磨砂字幕卡',intro:'加重的白字、青色侧条和更清楚的玻璃边缘。',points:['真实模糊当帧卡片后方的视频，外侧保持清晰。','调整字重、内边距和卡片渐变；保持圆角区域与预览一致。']}
];const $=id=>document.getElementById(id);let index=0,mode='en';styles.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`0${i+1} ${s.name}`;b.onclick=()=>select(i);$('tabs').append(b);const card=document.createElement('button');card.className='card';card.innerHTML=`<img src="${s.id}-en.jpg" alt="${s.name}本轮预设"><span>0${i+1} ${s.name}</span>`;card.onclick=()=>{select(i);window.scrollTo({top:0,behavior:'smooth'})};$('grid').append(card)});
function select(i){index=i;mode='en';update()}
function update(){const s=styles[index];$('video').pause();$('number').textContent=`PRESET 0${index+1} / 06`;$('name').textContent=s.name;$('intro').textContent=s.intro;$('points').innerHTML=s.points.map(p=>`<li>${p}</li>`).join('');$('comparison').src=`${s.id}-comparison.jpg`;$('video').src=`${s.id}-${mode}.mp4`;$('video').poster=`${s.id}-${mode}.jpg`;$('download').href=`${s.id}-${mode}.mp4`;['en','old','zh'].forEach(m=>$(m).setAttribute('aria-pressed',String(m===mode)));[...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));$('prev').disabled=index===0;$('next').disabled=index===5}
['en','old','zh'].forEach(m=>$(m).onclick=()=>{mode=m;update()});$('prev').onclick=()=>select(index-1);$('next').onclick=()=>select(index+1);update();
</script></html>
