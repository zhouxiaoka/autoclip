<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>X3 sponsor recharge shots</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background:#f5f5f4; margin:0; padding:24px; color:#1c1917; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:12px; padding:20px 24px; max-width:560px; margin:0 auto 28px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  h2 { font-size:14px; font-weight:600; margin:0 0 12px; color:#57534e; }
  .error { color:#b91c1c; font-size:14px; margin:0 0 8px; }
  .billing { color:#78716c; font-size:13px; margin:0 0 14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid #d6d3d1; background:#fafaf9; cursor:pointer; }
  .cta { background:#1c1917; color:#fff; border-color:#1c1917; }
</style>
</head>
<body>

<section class="card" id="sponsor-recharge">
  <h2>X3 · 赞助商余额不足 → 去充值</h2>
  <p class="error">分析：密钥没问题，是余额不足。充值后点重试即可。</p>
  <p class="billing">本次已消耗 3 次请求</p>
  <div class="actions">
    <button class="btn cta" type="button">去 88API 充值</button>
    <button class="btn" type="button">重试</button>
  </div>
</section>

<section class="card" id="non-sponsor-balance">
  <h2>X3 · 非赞助商 → 查看余额</h2>
  <p class="error">分析：余额或令牌额度不足，请充值或更换令牌后再试。</p>
  <p class="billing">本次已消耗 2 次请求</p>
  <div class="actions">
    <button class="btn cta" type="button">查看余额</button>
    <button class="btn" type="button">重试</button>
  </div>
</section>

<section class="card" id="billable-n">
  <h2>X3 · 已消耗 N 次（无金额）</h2>
  <p class="error">分析：密钥没问题，是余额不足。充值后点重试即可。</p>
  <p class="billing">本次已消耗 7 次请求</p>
  <div class="actions">
    <button class="btn cta" type="button">去 Infistar 充值</button>
    <button class="btn" type="button">重试</button>
  </div>
</section>

</body>
</html>
